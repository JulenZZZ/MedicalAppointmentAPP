<nav class="bg-slate-900 border-b border-slate-800 text-white sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- BRAND / LOGO -->
      <div class="flex items-center gap-3 cursor-pointer" routerLink="/">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-xl font-bold border border-cyan-500/30">
          🩺
        </div>
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">
          MediReserve
        </span>
      </div>

      <!-- DESKTOP NAVIGATION LINKS -->
      <div class="hidden md:flex items-center space-x-6">
        <a routerLink="/" 
           routerLinkActive="text-cyan-400 font-semibold" 
           [routerLinkActiveOptions]="{exact: true}"
           class="text-slate-300 hover:text-white transition-colors text-sm">
          Home
        </a>

        <!-- Authenticated Links: Patient -->
        <ng-container *ngIf="isLoggedIn && userRole === 'Patient'">
          <a routerLink="/patient" 
             routerLinkActive="text-cyan-400 font-semibold"
             class="text-slate-300 hover:text-white transition-colors text-sm">
            Find Doctors
          </a>
          <a routerLink="/my-appointments" 
             routerLinkActive="text-cyan-400 font-semibold"
             class="text-slate-300 hover:text-white transition-colors text-sm">
            My Appointments
          </a>
        </ng-container>

        <!-- Authenticated Links: Admin / Doctor -->
        <ng-container *ngIf="isLoggedIn && (userRole === 'Admin' || userRole === 'Doctor')">
          <a routerLink="/admin" 
             routerLinkActive="text-cyan-400 font-semibold"
             class="text-slate-300 hover:text-white transition-colors text-sm">
            Admin Dashboard
          </a>
        </ng-container>
      </div>

      <!-- DESKTOP ACTION BUTTONS -->
      <div class="hidden md:flex items-center gap-4">
        <ng-container *ngIf="!isLoggedIn; else userLoggedIn">
          <a routerLink="/auth" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm px-5 py-2.5 rounded-lg shadow-md transition-all hover:-translate-y-0.5">
            Sign In / Register
          </a>
        </ng-container>

        <ng-template #userLoggedIn>
          <div class="flex items-center gap-3">
            <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-cyan-300 border border-slate-700 font-medium">
              {{ userRole }}
            </span>
            <button (click)="logout()" class="text-sm text-slate-300 hover:text-rose-400 font-medium transition-colors px-3 py-1.5 rounded-lg hover:bg-slate-800">
              Sign Out
            </button>
          </div>
        </ng-template>
      </div>

      <!-- MOBILE MENU BUTTON -->
      <div class="md:hidden flex items-center">
        <button (click)="toggleMobileMenu()" class="text-slate-300 hover:text-white p-2 rounded-md focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path *ngIf="!isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path *ngIf="isMobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- MOBILE MENU DROPDOWN -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-6 space-y-3">
    <a routerLink="/" (click)="isMobileMenuOpen = false" class="block text-slate-300 hover:text-white py-2 text-base">Home</a>

    <ng-container *ngIf="isLoggedIn && userRole === 'Patient'">
      <a routerLink="/patient" (click)="isMobileMenuOpen = false" class="block text-slate-300 hover:text-white py-2 text-base">Find Doctors</a>
      <a routerLink="/my-appointments" (click)="isMobileMenuOpen = false" class="block text-slate-300 hover:text-white py-2 text-base">My Appointments</a>
    </ng-container>

    <ng-container *ngIf="isLoggedIn && (userRole === 'Admin' || userRole === 'Doctor')">
      <a routerLink="/admin" (click)="isMobileMenuOpen = false" class="block text-slate-300 hover:text-white py-2 text-base">Admin Dashboard</a>
    </ng-container>

    <div class="pt-4 border-t border-slate-800">
      <ng-container *ngIf="!isLoggedIn; else mobileUserLoggedIn">
        <a routerLink="/auth" (click)="isMobileMenuOpen = false" class="block w-full text-center bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-lg">
          Sign In / Register
        </a>
      </ng-container>

      <ng-template #mobileUserLoggedIn>
        <div class="flex items-center justify-between">
          <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-cyan-300 border border-slate-700">Role: {{ userRole }}</span>
          <button (click)="logout()" class="text-sm text-rose-400 font-semibold py-2">
            Sign Out
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</nav>
